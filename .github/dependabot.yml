version: 2
updates:
  - package-ecosystem: "mix"
    directory: "/"
    schedule:
      interval: "weekly"
    # This repository is retired. Keep the historical configuration, but do
    # not open new dependency update pull requests.
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "elixir"
    commit-message:
      prefix: "deps"
      include: "scope"
